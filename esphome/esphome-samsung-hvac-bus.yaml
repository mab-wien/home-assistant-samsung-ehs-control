  # Abgeleitete Temperaturdifferenzen, nur waehrend Verdichterbetrieb.
  # Verschiedene Busnachrichten treffen zeitversetzt ein: kein synchroner Messsatz.
  # EVI-Delta ist KEINE Einspritzueberhitzung (Zwischendruck fehlt).
  - platform: template
    name: 'Heißgas Überhitzung berechnet'
    id: dsh_calculated
    unit_of_measurement: 'K'
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (!id(compressor_frequency).has_state() ||
          !std::isfinite(id(compressor_frequency).state) ||
          id(compressor_frequency).state <= 0.0f) return NAN;
      if (!id(discharge_temp).has_state() || !id(sat_high).has_state()) return NAN;
      const float a = id(discharge_temp).state;
      const float b = id(sat_high).state;
      if (!std::isfinite(a) || !std::isfinite(b)) return NAN;
      return a - b;
    filters:
      - delta: 0  # nur echte Änderungen senden

  - platform: template
    name: 'Ansaug Überhitzung berechnet'
    id: suction_superheat_calculated
    unit_of_measurement: 'K'
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (!id(compressor_frequency).has_state() ||
          !std::isfinite(id(compressor_frequency).state) ||
          id(compressor_frequency).state <= 0.0f) return NAN;
      if (!id(suction).has_state() || !id(sat_low).has_state()) return NAN;
      const float a = id(suction).state;
      const float b = id(sat_low).state;
      if (!std::isfinite(a) || !std::isfinite(b)) return NAN;
      return a - b;
    filters:
      - delta: 0  # nur echte Änderungen senden

  - platform: template
    name: 'EVI Temperaturdifferenz Austritt minus Eintritt'
    id: evi_temperature_delta
    unit_of_measurement: 'K'
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (!id(compressor_frequency).has_state() ||
          !std::isfinite(id(compressor_frequency).state) ||
          id(compressor_frequency).state <= 0.0f) return NAN;
      if (!id(eviout).has_state() || !id(eviin).has_state()) return NAN;
      const float a = id(eviout).state;
      const float b = id(eviin).state;
      if (!std::isfinite(a) || !std::isfinite(b)) return NAN;
      return a - b;
    filters:
      - delta: 0  # nur echte Änderungen senden

  # Vorhandene Templates: gleiche sichtbare Namen wie bisher.
  - platform: template
    name: 'Raumtemperatur'
    unit_of_measurement: '°C'
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      if (!std::isfinite(id(room_temp_raw).state)) return NAN;
      return id(room_temp_raw).state - 1.4f;
    filters:
      - delta: 0  # nur echte Änderungen senden

  - platform: template
    name: 'COP gesamt'
    unit_of_measurement: 'COP'
    accuracy_decimals: 2
    update_interval: 300s
    lambda: |-
      float a = id(total_produced_energy).state;
      float b = id(total_consumed_energy).state;
      if (!std::isfinite(a) || !std::isfinite(b) || b <= 0) return NAN;
      return a / b;
    filters:
      - delta: 0  # nur echte Änderungen senden

  - platform: template
    name: 'COP momentan'
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 30s
    lambda: |-
      // Keine pauschale Heiz-COP-Aussage bei 0 Hz oder fehlenden Leistungen.
      float a = id(instant_power_out).state;
      float b = id(instant_power_in).state;
      if (id(compressor_frequency).state <= 0 || !std::isfinite(a) || !std::isfinite(b) || b < 100) return NAN;
      return a / b;
    filters:
      - delta: 0  # nur echte Änderungen senden

  - platform: template
    name: 'Heizwasser Spreizung Vorlauf minus Rücklauf'
    unit_of_measurement: 'K'
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      float a = id(water_out).state, b = id(water_in).state;
      if (!std::isfinite(a) || !std::isfinite(b)) return NAN;
      return a - b;
    filters:
      - delta: 0  # nur echte Änderungen senden

  - platform: template
    name: 'Heizwasser berechnete thermische Leistung'
    unit_of_measurement: 'W'
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float q = id(water_flow).state;
      float dt = id(water_out).state - id(water_in).state;
      // Nur positive Waermeabgabe im aktiven Verdichterbetrieb ausweisen.
      // Bei Rueckstroemung/Stillstand ist der Wert NICHT die erzeugte WP-Leistung.
      if (!id(compressor_frequency).has_state() || id(compressor_frequency).state <= 0) return NAN;
      if (!std::isfinite(q) || !std::isfinite(dt) || q <= 0 || q > 120 || dt <= 0 || dt > 35) return NAN;
      return q * dt * 69.77f; // L/min * Kelvin * 69.77 = W
    filters:
      - delta: 0  # nur echte Änderungen senden

  - platform: template
    name: 'Vorlauf Solltemperatur (Anzeige)'
    unit_of_measurement: '°C'
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      return id(outlet_target).state;
    filters:
      - delta: 0  # nur echte Änderungen senden

  - platform: template
    name: 'Warmwasser Solltemperatur (Anzeige)'
    unit_of_measurement: '°C'
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      return id(dhw_target).state;
    filters:
      - delta: 0  # nur echte Änderungen senden

  # NEUE FSV 1061-1064: reine LESEPROBES (kein number: / keine Schreibfunktion).
  # Das Basisprojekt Beormund unterstuetzt diese FSV noch nicht offiziell.
  # Register 0x431E-0x4321 aus einer Community-Datenliste; Zuweisung NICHT bestaetigt.
  # 0xFFFF / -1 und andere unplausible Antworten werden als unknown behandelt.
  # Die Quelle meldete an einer anderen Anlage -1; deshalb KEINE unbestaetigten
  # Rueckschluesse aus scheinbaren Hysterese-Werten ziehen.
  - platform: samsung_nasa
    message: 0x431E
    nasa_mode: FSV
    nasa_label: VAR_IN_FSV_1061
    nasa_device_id: samsung_indoor
    name: 'FSV 1061 - Vorlauftemperatur Hysterese Heizen (Test)'
    id: fsv_1061_probe
    entity_category: diagnostic
    state_class: measurement
    unit_of_measurement: '°C'
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - lambda: |-
          const int16_t raw = static_cast<int16_t>(static_cast<uint16_t>(x));
          if (raw < 10 || raw > 70) return NAN;
          return raw * 0.1f;
      - delta: 0  # nur echte Änderungen senden

  - platform: samsung_nasa
    message: 0x431F
    nasa_mode: FSV
    nasa_label: VAR_IN_FSV_1062
    nasa_device_id: samsung_indoor
    name: 'FSV 1062 - Vorlauftemperatur Hysterese Kühlen (Test)'
