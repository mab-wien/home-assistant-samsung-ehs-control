# Samsung EHS / Beormund NASA Vollausbau – sprechende Namen DIREKT in ESPHome.
# Erweiterung: Diagnose-Leseproben FSV 1061-1064 (unbestaetigte NASA-Adressen)
# und Heizwasser-Vorlaufabweichung. FSV 6031 nicht lesbar ohne bestaetigten Code.
# Alle 91 FSV-Readonly-Entitaeten UND 91 interne FSV-Quellen sind aussagekraeftig benannt.
# Auch saemtliche NEU hinzugekommenen NASA-Telemetrie- und Diagnosedaten sind deutsch benannt.
# Bisherige Sensornamen aus der urspruenglichen Integration bleiben erhalten (Automatisierungen).
# FSV-Einstellungen bleiben internal: true; nur Readonly-Spiegel sind in HA sichtbar.
# ACHTUNG: Umbenannte neue ESPHome-Entitaeten koennen in HA neue Entity-IDs erhalten.
# Vor Flash: ESPHome config + compile pruefen. Es wurden KEINE Betriebswerte geaendert.
# Beormund NASA Client, gleiche ESP32/GPIO/WLAN/API/OTA-Konfiguration wie bisher.

esphome:
  min_version: 2026.5.0
  name: !secret name
  friendly_name: !secret name

esp32:
  board: m5stack-atom
  # Optional (silence ESPHome notice):
  framework:
    type: esp-idf

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# Debug & Syslog startet AUS. Lokale INFO/WARN/ERROR bleiben verfuegbar.
# Kein separater syslog:-Block: Versand ausschliesslich hinter der Schalterabfrage.
logger:
  level: DEBUG
  initial_level: INFO
  on_message:
    level: DEBUG
    then:
      - if:
          condition:
            lambda: |-
              return id(debug_stream_enabled) && !id(syslog_forwarding_busy)
                     && std::string(tag) != "udp";
          then:
            - lambda: |-
                id(syslog_forwarding_busy) = true;
            - udp.write:
                id: syslog_udp
                data: !lambda |-
                  // BSD/RFC3164, facility local0. Keine Log-Aufrufe in diesem Callback!
                  const int severity = level == 1 ? 3 : level == 2 ? 4 : level == 3 ? 6 : 7;
                  auto clock = id(ha_time).now();
                  std::string stamp = clock.is_valid() ? clock.strftime("%b %e %H:%M:%S")
                                                       : "Jan  1 00:00:00";
                  // ANSI-Farbcodes entfernen; eine Syslog-Nachricht pro Logzeile.
                  std::string clean;
                  const std::string raw(message);
                  for (size_t i = 0; i < raw.size(); ++i) {
                    if (raw[i] == '\x1b' && i + 1 < raw.size() && raw[i + 1] == '[') {
                      i += 2;
                      while (i < raw.size() && !(raw[i] >= '@' && raw[i] <= '~')) ++i;
                    } else {
                      clean += (raw[i] == '\n' || raw[i] == '\r') ? ' ' : raw[i];
                    }
                  }
                  std::string packet = "<" + std::to_string(16 * 8 + severity) + ">" + stamp
                                     + " " + App.get_name().c_str() + " " + tag + ": " + clean;
                  // UDP-Komponente: maximal 508 Byte pro Datagramm.
                  if (packet.size() > 508) packet.resize(508);
                  return packet;
            - lambda: |-
                id(syslog_forwarding_busy) = false;

globals:
  - id: debug_stream_enabled
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: syslog_forwarding_busy
    type: bool
    restore_value: false
    initial_value: 'false'

udp:
  id: syslog_udp
  addresses:
    - !secret syslog_server_ip
  port:
    - !secret syslog_server_port

mdns:
  disabled: false
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA3
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1
  ap:
    ssid: !secret wifi_hotspot_ssid
    password: !secret wifi_hotspot_password


api:
  encryption:
    key: !secret api_key

# OTA with password (REQUIRED)
ota:
  - platform: esphome
    password: !secret ota_password

captive_portal:

# Needed for "Night active" / time-window sensors
time:
  - platform: homeassistant
    id: ha_time

uart:
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 9600
  parity: EVEN


external_components:
  - source: github://Beormund/esphome-samsung-nasa@main
    components: [samsung_nasa]

samsung_nasa:
  nasa_controller_id: samsung_nasa_controller
  debug_log_messages: false
  debug_log_undefined_messages: false
  nasa_client: {}
  devices:
    - address: 20.00.00
      id: samsung_indoor
    - address: 10.00.00
      id: samsung_outdoor

