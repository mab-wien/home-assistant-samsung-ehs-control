# FSV-Leseanforderungen (KEINE Schreibvorgaenge). Groesse je Batch begrenzt.
# Bei 80+ FSV Werten kann der ESP32 ueberlastet werden; Vollversion erst nach RAM-Check.
interval:
  # Diagnose begrenzen: nach 20 min oder bei < 30 kB freiem Speicher automatisch aus (Grund im Log)
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              return id(debug_stream_enabled) &&
                     (millis() - id(debug_start_ms) > 20UL * 60UL * 1000UL || esp_get_free_heap_size() < 30000);
          then:
            - logger.log:
                level: WARN
                tag: syslog_control
                format: 'Diagnose automatisch beendet (Laufzeit %u s, freier Speicher %u Byte)'
                args: ['(millis() - id(debug_start_ms)) / 1000', 'esp_get_free_heap_size()']
            - switch.turn_off: debug_gesamt
  - interval: 24h
    startup_delay: 120s
    then:
      - samsung_nasa.request_read:
          id: [fsv_1011, fsv_1012, fsv_1021, fsv_1022, fsv_1031, fsv_1032, fsv_1041, fsv_1042]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_1051, fsv_1052, fsv_2011, fsv_2012, fsv_2021, fsv_2022, fsv_2031, fsv_2032]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_2051, fsv_2052, fsv_2061, fsv_2062, fsv_2071, fsv_2072, fsv_3021, fsv_3022]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_3023, fsv_3024, fsv_3025, fsv_3026, fsv_3032, fsv_3033, fsv_3043, fsv_3044]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_3045, fsv_3052, fsv_3046, fsv_3081, fsv_3082, fsv_3083, fsv_4012, fsv_4013]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_4024, fsv_4025, fsv_4033, fsv_4042, fsv_4043, fsv_4044, fsv_4045, fsv_4046]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_5011, fsv_5013, fsv_5014, fsv_5015, fsv_5016, fsv_5017, fsv_5018, fsv_5019]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_5021, fsv_5023, fsv_5082, fsv_5083, fsv_5092, fsv_5093, fsv_2041, fsv_2081]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_2091, fsv_2092, fsv_2093, fsv_3011, fsv_3042, fsv_3061, fsv_3071, fsv_4011]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_4021, fsv_4022, fsv_4041, fsv_4051, fsv_4052, fsv_4053, fsv_3031, fsv_3041]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_3051, fsv_4023, fsv_4031, fsv_4032, fsv_4061, fsv_5022, fsv_5041, fsv_5051]
      - delay: 3s
      - samsung_nasa.request_read:
          id: [fsv_5081, fsv_5091, fsv_5094]
      - delay: 3s
      # 1061-1064: zusaetzliche, nur lesende PROBES mit unbestaetigten NASA-IDs
      - samsung_nasa.request_read:
          id: [fsv_1061_probe, fsv_1062_probe, fsv_1063_probe, fsv_1064_probe]

# Ohne einen neuen Flash koennen diese vier Testadressen erneut angefragt werden.
# Button sendet ausschliesslich NASA READ, niemals WRITE.
button:
  - platform: template
    name: 'FSV 1061-1064 - Hysterese-Testwerte erneut lesen'
    entity_category: diagnostic
    on_press:
      - samsung_nasa.request_read:
          id: [fsv_1061_probe, fsv_1062_probe, fsv_1063_probe, fsv_1064_probe]

  # EXPERIMENTELL: NASA 0x8065 = 1; Wirkung als K3-Reset nicht bestaetigt.
  # Ausschliesslich manueller Aufruf. Keine automatische Fehlerquittierung.
  - platform: template
    name: 'E438 Reset-Test 0x8065'
    id: e438_reset_test
    icon: mdi:restart-alert
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (!id(error_code).has_state() || !id(compressor_frequency).has_state() ||
              id(error_code).state != 438.0f || id(compressor_frequency).state != 0.0f) {
            ESP_LOGW("reset_test", "Nicht gesendet: benoetigt E438 und Verdichter 0 Hz; Fehler=%.0f, Hz=%.1f",
                     id(error_code).state, id(compressor_frequency).state);
            return;
          }
          static uint32_t last_attempt = 0;
          const uint32_t now_ms = millis();
          if (last_attempt != 0 && (uint32_t)(now_ms - last_attempt) < 60000) {
            ESP_LOGW("reset_test", "Nicht gesendet: 60 Sekunden Abstand zwischen Testversuchen erforderlich");
            return;
          }
          last_attempt = now_ms;
          ESP_LOGW("reset_test", "EXPERIMENT: NASA Request an 10.00.00: 0x8065 = 1; Resetwirkung NICHT bestaetigt");
          id(samsung_nasa_controller).write("10.00.00", 0x8065, 1);

  # Nur lesende NASA-Abfrage; keine Aenderung und kein Reset.
  # Die read()-Methode der Komponente sendet an die NASA-Broadcastadresse.
  - platform: template
    name: 'NASA 0x8065 nur lesen'
    id: outdoor_reset_read_test
    icon: mdi:database-search
    entity_category: diagnostic
    on_press:
      - lambda: |-
          ESP_LOGW("reset_test", "Nur READ: frage NASA 0x8065 ab; kein WRITE und kein Reset. Antwort im NASA-Log pruefen.");
          id(samsung_nasa_controller).read({0x8065});
