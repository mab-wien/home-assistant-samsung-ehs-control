    entity_category: diagnostic
  # FSV-Info 0x4612 (Antwort auf Leseanfrage mit FSV-Nummer): [FSV 2B] 01 [Typ] 01 [Min 2B] [Max 2B] [Wert 2B] 01 00 00 00
  - platform: samsung_nasa
    message: 0x4612
    nasa_device_id: samsung_indoor
    name: 'FSV-Info Antwort (0x4612)'
    id: fsv_info_antwort
    entity_category: diagnostic
    on_value:
      - lambda: |-
          // Antwort als Hex-Text: [FSV 2B] 01 [Typ] [x] [Min 2B] [Max 2B] [Wert 2B] ...; Typ 0x0A = Wert x 0,1
          std::vector<uint8_t> b;
          for (size_t i = 0; i + 1 < x.size(); i += 3) b.push_back((uint8_t) strtol(x.substr(i, 2).c_str(), nullptr, 16));
          if (b.size() < 11) return;
          const int nr = (b[0] << 8) | b[1];
          const int16_t roh = (int16_t) ((b[9] << 8) | b[10]);
          // Typ 0x0A und die Hysterese-FSV 1061-1064 in 0,1 K; -1 (FFFF) = nicht belegt
          const bool zehntel = b[3] == 0x0A || (nr >= 1061 && nr <= 1064);
          const float w = roh == -1 ? NAN : (zehntel ? roh / 10.0f : (float) roh);
          switch (nr) {
              case 1061: id(fsvinfo_1061).publish_state(w); break;
              case 1062: id(fsvinfo_1062).publish_state(w); break;
              case 1063: id(fsvinfo_1063).publish_state(w); break;
              case 1064: id(fsvinfo_1064).publish_state(w); break;
              case 4054: id(fsvinfo_4054).publish_state(w); break;
              case 4062: id(fsvinfo_4062).publish_state(w); break;
              case 4063: id(fsvinfo_4063).publish_state(w); break;
              case 5033: id(fsvinfo_5033).publish_state(w); break;
              case 6022: id(fsvinfo_6022).publish_state(w); break;
              case 6031: id(fsvinfo_6031).publish_state(w); break;
              case 6041: id(fsvinfo_6041).publish_state(w); break;
              default: break;
          }
