switch:
  - platform: template
    name: 'Debug & Syslog'
    id: debug_gesamt
    icon: mdi:bug
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - logger.set_level: DEBUG
      - lambda: |-
          id(debug_start_ms) = millis();
          id(debug_stream_enabled) = true;
          id(samsung_nasa_controller).set_debug_log_messages(true);
          id(samsung_nasa_controller).set_debug_log_undefined_messages(true);
      - logger.log:
          level: INFO
          tag: syslog_control
          format: 'Debug & Syslog EIN - UDP 514'
    turn_off_action:
      - lambda: |-
          // Versand zuerst sperren: ab jetzt auch keine Warnungen/Fehler an Syslog.
          id(debug_stream_enabled) = false;
          id(samsung_nasa_controller).set_debug_log_messages(false);
          id(samsung_nasa_controller).set_debug_log_undefined_messages(false);
          id(samsung_nasa_controller).set_debug_log_messages_raw(false);
          id(nasa_rohbytes).publish_state(false);
      - logger.set_level: INFO
      - logger.log:
          level: INFO
          tag: syslog_control
          format: 'Debug & Syslog AUS - nur lokale Logs'
  - platform: template
    name: 'NASA Rohbytes protokollieren'
    id: nasa_rohbytes
    icon: mdi:code-brackets
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    # Wirkt nur bei eingeschaltetem „Debug & Syslog“; unveränderte Telegramme in nummerierten Teilen
    turn_on_action:
      - lambda: id(samsung_nasa_controller).set_debug_log_messages_raw(true);
    turn_off_action:
      - lambda: id(samsung_nasa_controller).set_debug_log_messages_raw(false);
