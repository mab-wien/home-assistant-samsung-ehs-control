text_sensor:
  # 0x8404 exakt (Ganzzahl ohne Gleitkommaverlust) und hexadezimal; Bedeutung offen (Auswertung 30.10.2026)
  - platform: samsung_nasa
    message: 0x8404
    nasa_device_id: samsung_outdoor
    name: 'NASA 0x8404 Rohwert exakt'
    device_id: nasa_roh
    id: nasa_8404_exakt
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            const uint32_t v = (uint32_t) strtoll(x.c_str(), nullptr, 10);
            char hex[11];
            snprintf(hex, sizeof(hex), "0x%08X", (unsigned) v);
            id(nasa_8404_hex).publish_state(hex);
            id(nasa_8404_bit_01).publish_state((v >> 1) & 1);
            id(nasa_8404_bit_06).publish_state((v >> 6) & 1);
            id(nasa_8404_bit_09).publish_state((v >> 9) & 1);
            id(nasa_8404_bit_13).publish_state((v >> 13) & 1);
            id(nasa_8404_bit_15).publish_state((v >> 15) & 1);
            id(nasa_8404_bit_16).publish_state((v >> 16) & 1);
            id(nasa_8404_bit_18).publish_state((v >> 18) & 1);
            id(nasa_8404_bit_23).publish_state((v >> 23) & 1);
            id(nasa_8404_bit_26).publish_state((v >> 26) & 1);
  - platform: template
    name: 'NASA 0x8404 hex'
