  # FSV 6031 (Abschalten bei lange niedriger Verdichterfrequenz):
  # KEIN verlaesslich zugeordneter NASA-Code; NICHT als falsche Entitaet anlegen.
  # FSV 6022 (min. Laufzeit), 6041 (Thermostatsteuerung) ebenfalls nicht
  # ohne Registeradresse abfragen. Zugriff per 'fsv: 6031' funktioniert NICHT;
  # die Beormund-Validierung erlaubt FSV-Nummern derzeit nur bis 5094.

  # Nützlicher Zusatz zur Taktdiagnose: positiv = VL ueber Soll.
  - platform: template
    name: 'Heizwasser Vorlaufabweichung Ist minus Soll'
    id: hp_flow_above_target
    unit_of_measurement: 'K'
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      if (!id(water_out).has_state() || !id(outlet_target).has_state()) return NAN;
      return id(water_out).state - id(outlet_target).state;
    filters:
      - delta: 0  # nur echte Änderungen senden

