# Samsung EHS (ClimateHub Mono) – NASA-Bus über ESPHome, Komponente: Fork mab-wien/esphome-samsung-nasa.
# Bereinigt am 22.10.2026: deutsche Entitätsnamen ohne Präfix; HA-entity_ids einheitlich wp_* (Zuordnung:
# docs/umbenennung-wp-2026-10-22.csv). FSV-Einstellungen bleiben internal; sichtbar sind nur Lesekopien.
# Diagnose (Schalter „Debug & Syslog“) startet AUS, endet automatisch nach 20 min oder bei wenig freiem Speicher;
# Syslog-Zeilen tragen Laufnummer q, am ESP verworfene (d) und gekürzte (k) Zeilen werden gezählt.
# Zugangsdaten nur in secrets.yaml (nicht im Git). Firmware-Protokoll: docs/firmware.md.

esphome:
  min_version: 2026.5.0
  name: !secret name
  friendly_name: !secret name

esp32:
  board: m5stack-atom
  # Optional (silence ESPHome notice):
  framework:
    type: esp-idf

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# Debug & Syslog startet AUS. Lokale INFO/WARN/ERROR bleiben verfuegbar.
# Kein separater syslog:-Block: Versand ausschliesslich hinter der Schalterabfrage.
logger:
  level: DEBUG
  initial_level: INFO
  on_message:
    level: DEBUG
    then:
      - if:
          condition:
            lambda: |-
              if (!id(debug_stream_enabled) || std::string(tag) == "udp") return false;
              if (id(syslog_forwarding_busy)) { id(syslog_verworfen)++; return false; }
              return true;
          then:
            - lambda: |-
                id(syslog_forwarding_busy) = true;
            - udp.write:
                id: syslog_udp
                data: !lambda |-
                  // BSD/RFC3164, facility local0. Keine Log-Aufrufe in diesem Callback!
                  const int severity = level == 1 ? 3 : level == 2 ? 4 : level == 3 ? 6 : 7;
                  auto clock = id(ha_time).now();
                  std::string stamp = clock.is_valid() ? clock.strftime("%b %e %H:%M:%S")
                                                       : "Jan  1 00:00:00";
                  // ANSI-Farbcodes entfernen; eine Syslog-Nachricht pro Logzeile.
                  std::string clean;
                  const std::string raw(message);
                  for (size_t i = 0; i < raw.size(); ++i) {
                    if (raw[i] == '\x1b' && i + 1 < raw.size() && raw[i + 1] == '[') {
                      i += 2;
                      while (i < raw.size() && !(raw[i] >= '@' && raw[i] <= '~')) ++i;
                    } else {
                      clean += (raw[i] == '\n' || raw[i] == '\r') ? ' ' : raw[i];
                    }
                  }
                  id(syslog_laufnummer)++;
                  std::string packet = "<" + std::to_string(16 * 8 + severity) + ">" + stamp
                                     + " " + App.get_name().c_str() + " " + tag + ": q="
                                     + std::to_string(id(syslog_laufnummer)) + " d=" + std::to_string(id(syslog_verworfen))
                                     + " k=" + std::to_string(id(syslog_gekuerzt)) + " " + clean;
                  // UDP-Komponente: maximal 508 Byte pro Datagramm; Kürzung wird gezählt.
                  if (packet.size() > 508) { packet.resize(508); id(syslog_gekuerzt)++; }
                  return std::vector<uint8_t>(packet.begin(), packet.end());
            - lambda: |-
                id(syslog_forwarding_busy) = false;

globals:
  - id: debug_stream_enabled
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: syslog_forwarding_busy
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: syslog_laufnummer
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: syslog_verworfen
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: syslog_gekuerzt
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: debug_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

udp:
  id: syslog_udp
  addresses:
    - !secret syslog_server_ip
  port: !secret syslog_server_port

mdns:
  disabled: false
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA3
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1
  ap:
    ssid: !secret wifi_hotspot_ssid
    password: !secret wifi_hotspot_password


api:
  encryption:
    key: !secret api_key

# OTA with password (REQUIRED)
ota:
  - platform: esphome
    password: !secret ota_password

captive_portal:

# Needed for "Night active" / time-window sensors
time:
  - platform: homeassistant
    id: ha_time

uart:
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 9600
  parity: EVEN


external_components:
  - source: github://mab-wien/esphome-samsung-nasa@0ad8fc319bd6186dfade08210cadab0304b858ab   # Fork, Branch diagnose
    components: [samsung_nasa]

samsung_nasa:
  nasa_controller_id: samsung_nasa_controller
  debug_log_messages: false
  debug_log_undefined_messages: false
  nasa_client: {}
  devices:
    - address: 20.00.00
      id: samsung_indoor
    - address: 10.00.00
      id: samsung_outdoor

