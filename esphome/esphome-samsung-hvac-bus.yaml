# Samsung EHS (ClimateHub Mono) – NASA-Bus über ESPHome, Komponente: Beormund/esphome-samsung-nasa.
# Bereinigt am 22.10.2026: deutsche Entitätsnamen ohne Präfix; HA-entity_ids einheitlich wp_*. FSV-Einstellungen bleiben internal; sichtbar sind nur Lesekopien.
# Diagnose (Schalter „Debug & Syslog“) startet AUS, endet automatisch nach 20 min oder bei wenig freiem Speicher;
# Syslog-Zeilen tragen Laufnummer q, am ESP verworfene (d) und gekürzte (k) Zeilen werden gezählt.
# Zugangsdaten nur in secrets.yaml (nicht im Git). Firmware-Stand: docs/firmware.md.

esphome:
  min_version: 2026.10.0
  name: !secret name
  friendly_name: !secret name
  # FSV-Werte in HA nach Gruppen als eigene Geräte (Untergeräte), 06.11.2026
  devices:
    - id: fsv_1
      name: 'FSV 1xxx Bedienteil-Grenzen'
    - id: fsv_2
      name: 'FSV 2xxx Heizkurve'
    - id: fsv_3
      name: 'FSV 3xxx Warmwasser'
    - id: fsv_4
      name: 'FSV 4xxx Heizung und Zusatzheizung'
    - id: fsv_5
      name: 'FSV 5xxx Sonstiges und Smart Grid'
    - id: fsv_6
      name: 'FSV 6xxx Außengerät-Steuerung'
    # NASA-Rohwerte (Bedeutung unbestätigt/vermutet) gesammelt, 11.11.2026; Anzeigenamen nur in HA vergeben
    - id: nasa_roh
      name: 'NASA Rohwerte (Diagnose)'
  on_boot:
    - priority: -100
      then:
        - script.execute: startrunde
        # Sicherheitsnetz: WLAN spätestens nach 240 s, auch wenn die Startrunde hängen sollte
        - delay: 240s
        - wifi.enable:
    - priority: 600
      then:
        # Fehlercode 0x8235: die Bibliothek setzt delta: 1 vor das eigene delta: 0, damit gehen Wechsel um
        # genau 1 verloren (z. B. 438 -> 439, 0 -> 1). Ersetzen durch reines delta: 0 (nur echte Änderungen).
        - lambda: |-
            id(error_code).set_filters({new sensor::DeltaFilter(0.0f, 0.0f, std::numeric_limits<float>::infinity(), 0.0f)});
  includes:
    - energie_toepfe.h

esp32:
  board: m5stack-atom
  # Optional (silence ESPHome notice):
  framework:
    type: esp-idf

web_server:
  port: 80
  ota: false  # Firmware nur über verschlüsseltes OTA, kein unverschlüsselter /update-Upload über die Weboberfläche
  auth:
    type: digest  # basic sendet das Passwort leicht umkehrbar; Voreinstellung wird ab ESPHome 2027.1 digest
    username: !secret web_username
    password: !secret web_password

# Debug & Syslog startet AUS. Lokale INFO/WARN/ERROR bleiben verfuegbar.
# Kein separater syslog:-Block: Versand ausschliesslich hinter der Schalterabfrage.
logger:
  level: DEBUG
  initial_level: INFO
  on_message:
    level: DEBUG
    then:
      - if:
          condition:
            lambda: |-
              if (!id(debug_stream_enabled) || std::string(tag) == "udp") return false;
              // q zählt jede erzeugte Zeile, auch verworfene: jede Lücke in q ist ein Verlust (ESP oder WLAN)
              id(syslog_laufnummer)++;
              if (id(syslog_forwarding_busy)) { id(syslog_verworfen)++; return false; }
              // Speicher knapp (z. B. Paketflut bei vielen Bus-Anfragen): sofort aus, bevor eine String-Allokation
              // fehlschlägt (Absturz 09.11.2026 22:59, Abort in operator new). Grund meldet das 10-s-Intervall.
              if (heap_caps_get_free_size(MALLOC_CAP_8BIT) < 12000 ||
                  heap_caps_get_largest_free_block(MALLOC_CAP_8BIT) < 2048) {
                id(debug_stream_enabled) = false;
                id(samsung_nasa_controller).set_debug_log_messages(false);
                id(samsung_nasa_controller).set_debug_log_undefined_messages(false);
                id(samsung_nasa_controller).set_debug_log_messages_raw(false);
                id(syslog_verworfen)++;
                return false;
              }
              return true;
          then:
            - lambda: |-
                id(syslog_forwarding_busy) = true;
            - udp.write:
                id: syslog_udp
                data: !lambda |-
                  // BSD/RFC3164, facility local0. Keine Log-Aufrufe in diesem Callback!
                  const int severity = level == 1 ? 3 : level == 2 ? 4 : level == 3 ? 6 : 7;
                  auto clock = id(ha_time).now();
                  std::string stamp = clock.is_valid() ? clock.strftime("%b %e %H:%M:%S")
                                                       : "Jan  1 00:00:00";
                  // ANSI-Farbcodes entfernen; eine Syslog-Nachricht pro Logzeile.
                  std::string clean;
                  const std::string raw(message);
                  for (size_t i = 0; i < raw.size(); ++i) {
                    if (raw[i] == '\x1b' && i + 1 < raw.size() && raw[i + 1] == '[') {
                      i += 2;
                      while (i < raw.size() && !(raw[i] >= '@' && raw[i] <= '~')) ++i;
                    } else {
                      clean += (raw[i] == '\n' || raw[i] == '\r') ? ' ' : raw[i];
                    }
                  }
                  std::string packet = "<" + std::to_string(16 * 8 + severity) + ">" + stamp
                                     + " " + App.get_name().c_str() + " " + tag + ": q="
                                     + std::to_string(id(syslog_laufnummer)) + " " + clean;
                  // UDP-Komponente: maximal 508 Byte pro Datagramm; Kürzung wird gezählt.
                  if (packet.size() > 508) { packet.resize(508); id(syslog_gekuerzt)++; }
                  return std::vector<uint8_t>(packet.begin(), packet.end());
            - lambda: |-
                id(syslog_forwarding_busy) = false;

globals:
  - id: debug_stream_enabled
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: syslog_forwarding_busy
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: syslog_laufnummer
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: syslog_verworfen
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: syslog_gekuerzt
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: debug_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Diagnose 0x803F/0x8404 (30.10.2026): Zeitpunkt des letzten Empfangs (Unix-Zeit, 0 = noch nicht empfangen)
  - id: nasa_803f_empfang
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: nasa_8404_empfang
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # COP momentan: Wärmeleistung/Leistungsaufnahme seit der letzten Berechnung empfangen
  - id: cop_waerme_frisch
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cop_strom_frisch
    type: bool
    restore_value: false
    initial_value: 'false'

udp:
  id: syslog_udp
  addresses:
    - !secret syslog_server_ip
  port: !secret syslog_server_port

mdns:
  disabled: false
  
wifi:
  # erst nach der Startrunde einschalten (script startrunde), Sicherheitsnetz 240 s in on_boot
  enable_on_boot: false
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA3
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1
  ap:
    ssid: !secret wifi_hotspot_ssid
    password: !secret wifi_hotspot_password


api:
  encryption:
    key: !secret api_key

# OTA verschlüsselt (REQUIRED)
ota:
  - platform: esphome
    # Verschlüsselt mit dem API-Schlüssel (Noise) statt Passwort; Uploads ohne Verschlüsselung werden abgelehnt.
    encryption:

captive_portal:

# Needed for "Night active" / time-window sensors
time:
  - platform: homeassistant
    id: ha_time

uart:
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 9600
  parity: EVEN


external_components:
  - source: github://Beormund/esphome-samsung-nasa@3f2bede8e0496d594656bde7a2857e942afe9d8d   # Beormund main (enthält #154–#158, #160)
    components: [samsung_nasa]

samsung_nasa:
  nasa_controller_id: samsung_nasa_controller
  debug_log_messages: false
  debug_log_undefined_messages: false
  nasa_client: {}
  # eigene Absenderadresse statt 80.ff.00: andere Geräte am Bus mit 80.ff.00 bekommen sonst unsere Antworten
  # und wir ihre (Lesen/Schreiben mit 80.ff.02 an Innen- und Außengerät geprüft 09.11.2026)
  source_address: 80.ff.02
  devices:
    - address: 20.00.00
      id: samsung_indoor
    - address: 10.00.00
      id: samsung_outdoor
    - address: 62.00.91          # WLAN-Modul MIM-H04EN (dezimal: 62.00.145)
      id: samsung_wifikit

