# FSV-Leseanforderungen (KEINE Schreibvorgaenge). Groesse je Batch begrenzt.
# Bei 80+ FSV Werten kann der ESP32 ueberlastet werden; Vollversion erst nach RAM-Check.

# Climate-Kacheln (Komponente): Warmwasser mit Soll, Ist und Betriebsart als Preset; Heizung nur Ein/Aus, Vorlauf
# und Anforderung – kein Sollwert, weil die Anlage nach Heizkurve regelt (Versatz bleibt eigene Zahl).
climate:
  - platform: samsung_nasa
    name: 'Warmwasser'
    id: climate_warmwasser
    power_switch_id: dhw_power
    current_temp_sensor_id: warm_water
    target_temp_number_id: dhw_target
    custom_preset_select_id: dhw_mode
    action_mode_sensor:
      id: ventil_code
      mappings:
        0: CLIMATE_ACTION_IDLE
        1: CLIMATE_ACTION_HEATING
    visual:
      min_temperature: 30
      max_temperature: 60
      temperature_step:
        target_temperature: 1
        current_temperature: 0.1
  - platform: samsung_nasa
    name: 'Heizung'
    id: climate_heizung
    power_switch_id: heating_power
    current_temp_sensor_id: water_out
    action_mode_sensor:
      id: thermo_code
      mappings:
        0: CLIMATE_ACTION_IDLE
        1: CLIMATE_ACTION_HEATING
    visual:
      min_temperature: 15
      max_temperature: 60
      temperature_step:
        target_temperature: 1
        current_temperature: 0.1

interval:
  # Heißgas-Sollwerte 0x8223/0x422B: gezielte Abfrage am 30.10.2026 getestet, Außen- und Innengerät antworten
  # mit 65535 (= bei diesem Modell nicht vorhanden). Daher keine regelmäßige Abfrage.
  # Empfangszeitpunkte 0x803F/0x8404 einmal pro Minute veröffentlichen, nur wenn neu
  - interval: 60s
    then:
      - lambda: |-
          static uint32_t gesendet_803f = 0, gesendet_8404 = 0;
          if (id(nasa_803f_empfang) != 0 && id(nasa_803f_empfang) != gesendet_803f) {
            gesendet_803f = id(nasa_803f_empfang);
            id(nasa_803f_letzter_empfang).publish_state(ESPTime::from_epoch_utc(gesendet_803f).strftime("%Y-%m-%dT%H:%M:%SZ"));
          }
          if (id(nasa_8404_empfang) != 0 && id(nasa_8404_empfang) != gesendet_8404) {
            gesendet_8404 = id(nasa_8404_empfang);
            id(nasa_8404_letzter_empfang).publish_state(ESPTime::from_epoch_utc(gesendet_8404).strftime("%Y-%m-%dT%H:%M:%SZ"));
          }
  # Diagnose begrenzen: nach 20 min oder bei < 30 kB freiem Speicher automatisch aus (Grund im Log)
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              // auch wenn der Versand wegen knappem Speicher schon in on_message gesperrt wurde
              return id(debug_gesamt).state &&
                     (!id(debug_stream_enabled) || millis() - id(debug_start_ms) > 20UL * 60UL * 1000UL ||
                      esp_get_free_heap_size() < 30000);
          then:
            - logger.log:
                level: WARN
                tag: syslog_control
                format: 'Diagnose automatisch beendet (Laufzeit %u s, freier Speicher %u Byte)'
                args: ['(unsigned) ((millis() - id(debug_start_ms)) / 1000)', '(unsigned) esp_get_free_heap_size()']
            - switch.turn_off: debug_gesamt
  # Stündlich: FSV (ändern sich nur durch Einstellen am Bedienteil oder per Tool) und FSV-Info.
  # Statische Gerätedaten (Modell, Seriennummern, Firmware, MAC) nur in der Startrunde: ändern sie sich, war die
  # Anlage stromlos und der ESP startet ohnehin neu. Fehlerhistorie bei jeder Änderung des Fehlercodes.
  - interval: 1h
    startup_delay: 1h
    then:
      - script.execute: fsv_lesen
      - script.wait: fsv_lesen
      - script.execute: fsv_info_lesen
#       # 1061-1064: zusaetzliche, nur lesende PROBES mit unbestaetigten NASA-IDs
#       - samsung_nasa.request_read:
#           id: [fsv_1061_probe, fsv_1062_probe, fsv_1063_probe, fsv_1064_probe]

button:

  # EXPERIMENTELL: NASA 0x8065 = 1; Wirkung als K3-Reset nicht bestaetigt.
  # Ausschliesslich manueller Aufruf. Keine automatische Fehlerquittierung.
  - platform: template
    name: 'E438 Reset-Test 0x8065'
    id: e438_reset_test
    icon: mdi:restart-alert
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: |-
              if (!id(error_code).has_state() || !id(compressor_frequency).has_state() ||
                  id(error_code).state != 438.0f || id(compressor_frequency).state != 0.0f) {
                ESP_LOGW("reset_test", "Nicht gesendet: benoetigt E438 und Verdichter 0 Hz; Fehler=%.0f, Hz=%.1f",
                         id(error_code).state, id(compressor_frequency).state);
                return false;
              }
              static uint32_t last_attempt = 0;
              const uint32_t now_ms = millis();
              if (last_attempt != 0 && (uint32_t)(now_ms - last_attempt) < 60000) {
                ESP_LOGW("reset_test", "Nicht gesendet: 60 Sekunden Abstand zwischen Testversuchen erforderlich");
                return false;
              }
              last_attempt = now_ms;
              ESP_LOGW("reset_test", "EXPERIMENT: NASA Request an 10.00.00: 0x8065 = 1; Resetwirkung NICHT bestaetigt");
              return true;
          then:
            - samsung_nasa.request_write_as:
                nasa_device_id: samsung_outdoor
                message: 0x8065
                value: 1
                data_type: request

  # Fehler-Reset: NASA WRITE (nicht Request) 0x8065 = 2 an 10.00.00.
  # Wert 1 (obiger Test) setzte beim Reset auch Einstellungen zurück; Wert 2 wird als normaler Fehler-Reset vermutet.
  # Nur manuell, nur bei E438 und stehendem Verdichter, 60 s Abstand. Nicht automatisch.
  - platform: template
    name: 'Fehler zurücksetzen (E438)'
    id: e438_reset_write2
    icon: mdi:restart
    on_press:
      - if:
          condition:
            lambda: |-
              if (!id(error_code).has_state() || !id(compressor_frequency).has_state() ||
                  id(error_code).state != 438.0f || id(compressor_frequency).state != 0.0f) {
                ESP_LOGW("reset_test", "Nicht gesendet: benoetigt E438 und Verdichter 0 Hz; Fehler=%.0f, Hz=%.1f",
                         id(error_code).state, id(compressor_frequency).state);
                return false;
              }
              static uint32_t last_attempt = 0;
              const uint32_t now_ms = millis();
              if (last_attempt != 0 && (uint32_t)(now_ms - last_attempt) < 60000) {
                ESP_LOGW("reset_test", "Nicht gesendet: 60 Sekunden Abstand erforderlich");
                return false;
              }
              last_attempt = now_ms;
              ESP_LOGW("reset_test", "NASA Write an 10.00.00: 0x8065 = 2 (Fehler-Reset)");
              return true;
          then:
            - samsung_nasa.request_write_as:
                nasa_device_id: samsung_outdoor
                message: 0x8065
                value: 2
                data_type: write

  # Fehlerdaten des Aussengeraets abfragen (Telegramme 31.10.2026 am Bus mitgeschnitten). Antworten nur im Rohbyte-Mitschnitt
  # (Debug & Syslog + NASA Rohbytes), Auswertung: docker-ki-environment/scripts/wp-860b-dekodieren.py.
  # Weitere FSV über FSV-Info lesen (0x4612, NASA READ an 20.00.00, Nutzdaten = FSV-Nummer + 13 x 0), wie das WLAN-Modul beim Start. Nur lesend.
  - platform: template
    name: 'FSV über FSV-Info lesen (0x4612)'
    id: fsv_info_lesen_taste
    icon: mdi:magnify
    entity_category: diagnostic
    on_press:
      - script.execute: fsv_info_lesen
  - platform: template
    name: 'Gerätedaten lesen'
    id: geraetedaten_lesen_taste
    icon: mdi:information-outline
    entity_category: diagnostic
    on_press:
      - script.execute: geraetedaten_lesen
  # 0x461E Fehlerhistorie Innengeraet: NASA READ an 20.00.00, Nutzdaten 5 x 0 (Antwort 46 Byte).
  # Es werden nur lesende Abfragen gesendet.
  - platform: template
    name: 'Fehlerhistorie 0x461E lesen'
    id: fehlerhistorie_461e_lesen
    icon: mdi:history
    entity_category: diagnostic
    on_press:
      - logger.log:
          level: WARN
          tag: fehlerdaten
          format: "Lese 0x461E (Fehlerhistorie) von 20.00.00"
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x461E
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00]
  # 0x860B Zyklusdaten vor dem Fehler (Aussengeraet): Anfrage als Datentyp 2 (Write) an 10.00.00
  # mit Nutzdaten 00 01 00 00 00 00 als Abrufbefehl; das Aussengeraet streamt 30 Datensaetze (1/min) x 13 Pakete.
  # Exakte Wiederholung des mitgeschnittenen Telegramms, aendert laut Mitschnitt keine Einstellung. Mindestabstand 5 min.
  - platform: template
    name: 'Zyklusdaten vor Fehler 0x860B abrufen'
    id: zyklusdaten_860b_abrufen
    icon: mdi:chart-timeline-variant
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: |-
              static uint32_t letzter = 0;
              const uint32_t jetzt = millis();
              if (letzter != 0 && (uint32_t)(jetzt - letzter) < 300000) {
                ESP_LOGW("fehlerdaten", "0x860B nicht gesendet: 5 min Abstand erforderlich");
                return false;
              }
              letzter = jetzt;
              ESP_LOGW("fehlerdaten", "Rufe 0x860B (Zyklusdaten vor Fehler) von 10.00.00 ab");
              return true;
          then:
            - samsung_nasa.send_structure:
                nasa_device_id: samsung_outdoor
                message: 0x860B
                data_type: write
                payload: [0x00, 0x01, 0x00, 0x00, 0x00, 0x00]
  # 0x860B Betriebsart 3: Fehlercode-Historie des Aussengeraets (Ringspeicher 200 Eintraege, ohne Zeiten).
  # Antwort 16 Pakete; Aufbau siehe README der Komponente (Abschnitt 0x860B request modes).
  # Nur die getesteten Betriebsarten 1-4 und 6 verwenden.
  - platform: template
    name: 'Fehlercodes Aussengeraet 0x860B abrufen'
    id: fehlercodes_860b_abrufen
    icon: mdi:alert-circle-outline
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: |-
              static uint32_t letzter = 0;
              const uint32_t jetzt = millis();
              if (letzter != 0 && (uint32_t)(jetzt - letzter) < 300000) {
                ESP_LOGW("fehlerdaten", "0x860B/3 nicht gesendet: 5 min Abstand erforderlich");
                return false;
              }
              letzter = jetzt;
              ESP_LOGW("fehlerdaten", "Rufe 0x860B Betriebsart 3 (Fehlercodes) von 10.00.00 ab");
              return true;
          then:
            - samsung_nasa.send_structure:
                nasa_device_id: samsung_outdoor
                message: 0x860B
                data_type: write
                payload: [0x00, 0x03, 0x00, 0x00, 0x00, 0x00]

script:
  # Startrunde: erst alle Werte einmal vom Bus lesen, dann WLAN einschalten. So meldet sich der ESP bei HA
  # erst, wenn die Werte vollständig sind (statt minutenlang „unbekannt“). Sicherheitsnetz in on_boot.
  - id: startrunde
    mode: single
    then:
      - delay: 5s
      - script.execute: fsv_lesen
      - script.wait: fsv_lesen
      - samsung_nasa.request_read:
          id: [wp_nasa_8287_capa, wp_nasa_82e3_capa]  # statische Gerätedaten
      - delay: 2s
      - script.execute: fsv_info_lesen
      - script.wait: fsv_info_lesen
      - script.execute: geraetedaten_lesen
      - script.wait: geraetedaten_lesen
      # Werte, die sonst erst mit der nächsten Rundsendung kämen
      - samsung_nasa.request_read:
          id: [zone1_target, dhw_target, outlet_target, water_law_target, pump_pwm, since_install,
               active_since_install, dc_link_voltage, outdoor_instantaneous_power, outdoor_capacity]
      # warten, bis 20 s lang kein weiterer Wert dazukommt (höchstens 90 s)
      - wait_until:
          timeout: 90s
          condition:
            lambda: |-
              static uint32_t letzte_aenderung = millis();
              static int letzte_anzahl = -1;
              int fehlend = 0;
              for (auto *x : App.get_sensors()) if (!x->has_state()) fehlend++;
              for (auto *x : App.get_binary_sensors()) if (!x->has_state()) fehlend++;
              for (auto *x : App.get_text_sensors()) if (!x->has_state()) fehlend++;
              if (fehlend != letzte_anzahl) { letzte_anzahl = fehlend; letzte_aenderung = millis(); }
              return millis() - letzte_aenderung > 20000;
      - logger.log:
          level: INFO
          tag: startrunde
          format: 'Startrunde fertig nach %u s, WLAN ein'
          args: ['(unsigned) (millis() / 1000)']
      - wifi.enable:
  - id: fsv_lesen
    mode: single
    then:
      - samsung_nasa.request_read:
          id: [fsv_1011, fsv_1012, fsv_1021, fsv_1022, fsv_1031, fsv_1032, fsv_1041, fsv_1042]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_1051, fsv_1052, fsv_2011, fsv_2012, fsv_2021, fsv_2022, fsv_2031, fsv_2032]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_2051, fsv_2052, fsv_2061, fsv_2062, fsv_2071, fsv_2072, fsv_3021, fsv_3022]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_3023, fsv_3024, fsv_3025, fsv_3026, fsv_3032, fsv_3033, fsv_3043, fsv_3044]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_3045, fsv_3052, fsv_3046, fsv_3081, fsv_3082, fsv_3083, fsv_4012, fsv_4013]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_4024, fsv_4025, fsv_4033, fsv_4042, fsv_4043, fsv_4044, fsv_4045, fsv_4046]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_5011, fsv_5013, fsv_5014, fsv_5015, fsv_5016, fsv_5017, fsv_5018, fsv_5019]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_5021, fsv_5023, fsv_5082, fsv_5083, fsv_5092, fsv_5093, fsv_2041, fsv_2081]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_2091, fsv_2092, fsv_2093, fsv_3011, fsv_3042, fsv_3061, fsv_3071, fsv_4011]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_4021, fsv_4022, fsv_4041, fsv_4051, fsv_4052, fsv_4053, fsv_3031, fsv_3041]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_3051, fsv_4023, fsv_4031, fsv_4032, fsv_4061, fsv_5022, fsv_5041, fsv_5051]
      - delay: 2s
      - samsung_nasa.request_read:
          id: [fsv_5081, fsv_5091, fsv_5094, fsv_5012, fsv_5042, fsv_5043]  # 5012/5042/5043 ergänzt 30.10.2026: nach ESP-Neustart sonst unbekannt
      - delay: 2s
      - samsung_nasa.request_read:
          id: [wp_fsv_3034_roh, wp_fsv_4014_roh, wp_fsv_5031_roh, wp_fsv_5032_roh, wp_fsv_5061_roh, wp_fsv_5071_roh]  # ergänzt 05.11.2026
  # Gerätedaten, die nur auf Anfrage kommen (Modell, Seriennummern, Standort, Micom, MAC, Fehlerhistorie):
  # nach dem Start und täglich einmal lesen, nur lesende Abfragen. Anfragelängen wie am Bus beobachtet (09.11.2026).
  - id: geraetedaten_lesen
    mode: single
    then:
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x0600
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x0601
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x0602
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x0603
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x0605
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x0607
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x0608
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x061F
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_outdoor
          message: 0x061A
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_outdoor
          message: 0x0605
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_outdoor
          message: 0x0607
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_outdoor
          message: 0x8601
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_outdoor
          message: 0x0608
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_outdoor
          message: 0x060C
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_wifikit
          message: 0x061C
          data_type: read
          payload: [0x00]
      - delay: 1500ms
      - samsung_nasa.send_structure:
          nasa_device_id: samsung_indoor
          message: 0x461E
          data_type: read
          payload: [0x00, 0x00, 0x00, 0x00, 0x00]
  # Betriebsart (Heizen/Warmwasser/Pause/unbekannt, Abtauen) bei jeder Änderung von Frequenz, Ventil oder Abtauung
  - id: betriebsart_pruefen
    mode: queued
    then:
      - lambda: |-
          auto art = energie_toepfe::art_aus(
              id(compressor_frequency).has_state() && std::isfinite(id(compressor_frequency).state),
              id(compressor_frequency).state, id(ventil_warmwasser).has_state(), id(ventil_warmwasser).state);
          bool abtau = id(abtauung_aktiv).has_state() && id(abtauung_aktiv).state;
          energie_toepfe::fortschreiben(millis(), art, abtau);
      - script.execute: toepfe_senden
  - id: toepfe_senden
    mode: queued
    then:
      - lambda: |-
          using namespace energie_toepfe;
          auto senden = [](sensor::Sensor *s, float v) { if (!s->has_state() || s->state != v) s->publish_state(v); };
          senden(id(waerme_heizen), kwh(0, HEIZEN));
          senden(id(waerme_warmwasser), kwh(0, WARMWASSER));
          senden(id(waerme_abtauen), abtau_kwh(0));
          senden(id(waerme_sonstige), kwh(0, PAUSE) + kwh(0, UNBEKANNT));
          senden(id(strom_heizen), kwh(1, HEIZEN));
          senden(id(strom_warmwasser), kwh(1, WARMWASSER));
          senden(id(strom_abtauen), abtau_kwh(1));
          senden(id(strom_pause), kwh(1, PAUSE));
          senden(id(strom_unbekannt), kwh(1, UNBEKANNT));
          senden(id(laufzeit_heizen), laufzeit_h(HEIZEN));
          senden(id(laufzeit_warmwasser), laufzeit_h(WARMWASSER));
          senden(id(laufzeit_abtauen), abtau_h());
          senden(id(laufzeit_pause), laufzeit_h(PAUSE));
          senden(id(starts_heizen), starts(HEIZEN));
          senden(id(starts_warmwasser), starts(WARMWASSER));
          float a = id(total_produced_energy).state, b = id(total_consumed_energy).state;
          if (std::isfinite(a) && std::isfinite(b) && b > 0) senden(id(cop_gesamt), roundf(a / b * 100.0f) / 100.0f);
  - id: cop_paar
    mode: queued
    then:
      - lambda: |-
          if (!id(cop_waerme_frisch) || !id(cop_strom_frisch)) return;
          id(cop_waerme_frisch) = false;
          id(cop_strom_frisch) = false;
          // Keine Heiz-COP-Aussage bei 0 Hz oder fehlenden Leistungen
          float a = id(instant_power_out).get_raw_state();
          float b = id(instant_power_in).get_raw_state();
          const float hz = id(compressor_frequency).state;
          if (!id(compressor_frequency).has_state() || !std::isfinite(hz) || hz <= 0 ||
              !std::isfinite(a) || !std::isfinite(b) || b < 100) {
            id(cop_momentan).publish_state(NAN);
            return;
          }
